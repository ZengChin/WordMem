[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordmem"
version = "0.3.0"
description = "WordMem - 一款极简风格的 Windows 桌面背单词软件"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "WordMem Team" }]
dependencies = [
    "PySide6>=6.6",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pillow>=10.0",   # scripts/capture_screenshots.py 合成 GIF 用
]

[project.scripts]
wordmem = "wordmem.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wordmem = ["resources/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

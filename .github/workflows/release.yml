name: Release

# 推送 v* 标签时自动构建 Windows 安装包并发布到 GitHub Release。
# C++/Qt 版：jurplel/install-qt-action 装 Qt6（含语音/多媒体模块）-> CMake+Ninja 编译
# -> ctest -> windeployqt 收集依赖 -> Inno Setup 打包。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 安装 Qt 6.8（MSVC 2022 64 位）。TextToSpeech 依赖 Multimedia，两者都要装。
      # 该 action 会把 Qt 的 bin 加入 PATH，脚本经 qmake -query 自动定位前缀。
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          modules: "qtspeech qtmultimedia"
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # 一键：配置 + 编译 + 单元测试 + windeployqt + 生成 setup.exe
      - name: Build, test and package
        shell: pwsh
        run: ./cpp/scripts/build_windows.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/*.exe

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
